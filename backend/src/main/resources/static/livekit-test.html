<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>LiveKit 연결 테스트</title>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

    <style>
        video {
            width: 360px;
            margin: 10px;
            background: black;
        }
    </style>
</head>
<body>
<h1>LiveKit 테스트</h1>

<label>
    참가자 ID
    <input id="identity" value="browser-user-1">
</label>

<label>
    <input id="publishMedia" type="checkbox">
    카메라·마이크 발행
</label>

<button id="joinButton">방 입장</button>

<p id="status">입장 전</p>

<h2>내 화면</h2>
<div id="localVideo"></div>

<h2>상대 화면</h2>
<div id="remoteVideo"></div>

<script>
    const {
        Room,
        RoomEvent,
        Track
    } = LivekitClient;

    const room = new Room({
        adaptiveStream: true,
        dynacast: true
    });

    const statusElement = document.getElementById("status");
    const localVideoElement = document.getElementById("localVideo");
    const remoteVideoElement = document.getElementById("remoteVideo");

    room.on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
        const mediaElement = track.attach();
        mediaElement.autoplay = true;
        mediaElement.playsInline = true;

        remoteVideoElement.appendChild(mediaElement);
        statusElement.textContent =
            `${participant.identity}의 미디어 수신 중`;
    });

    room.on(RoomEvent.ParticipantConnected, (participant) => {
        statusElement.textContent =
            `상대 참가자 연결: ${participant.identity}`;
    });

    room.on(RoomEvent.ParticipantDisconnected, (participant) => {
        statusElement.textContent =
            `상대 참가자 퇴장: ${participant.identity}`;
    });

    document.getElementById("joinButton").addEventListener("click", async () => {
        try {
            const identity = document.getElementById("identity").value.trim();

            if (!identity) {
                throw new Error("참가자 ID를 입력하세요.");
            }

            statusElement.textContent = "토큰 발급 중...";

            const response = await fetch("/api/v1/livekit/test-token", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    identity: identity,
                    displayName: identity
                })
            });

            if (!response.ok) {
                throw new Error(await response.text());
            }

            const data = await response.json();

            const serverUrl =
                data.liveKitUrl ??
                data.livekitUrl ??
                data.url;

            const accessToken =
                data.accessToken ??
                data.token;

            statusElement.textContent = "LiveKit 연결 중...";

            await room.connect(serverUrl, accessToken);

            if (document.getElementById("publishMedia").checked) {
                await room.localParticipant.setCameraEnabled(true);
                await room.localParticipant.setMicrophoneEnabled(true);

                const cameraPublication =
                    room.localParticipant.getTrackPublication(Track.Source.Camera);

                if (cameraPublication?.track) {
                    const videoElement = cameraPublication.track.attach();

                    // 자신의 목소리가 다시 재생되지 않도록 처리
                    videoElement.muted = true;
                    videoElement.autoplay = true;
                    videoElement.playsInline = true;

                    localVideoElement.appendChild(videoElement);
                }
            }

            statusElement.textContent =
                `입장 성공: ${data.roomName ?? "test-room"} / ${identity}`;
        } catch (error) {
            console.error(error);
            statusElement.textContent = `입장 실패: ${error.message}`;
        }
    });
</script>
</body>
</html>
