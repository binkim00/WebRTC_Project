spring:
  application:
    name: melly-backend

  config:
    import: "optional:file:./.env[.properties]"

  docker:
    compose:
      enabled: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:melly}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:melly_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    # 기본값은 compose.yaml 의 Mailpit 이다. 운영에서는 MAIL_* 를 실제 SMTP 로 채운다.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          # Mailpit 은 인증과 STARTTLS 를 요구하지 않으므로 로컬 기본값은 false 다.
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          # SMTP 가 응답하지 않을 때 요청 스레드가 오래 붙잡히지 않도록 짧게 제한한다.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # 녹화 파일 자체의 최대 크기는 2GB다.
      max-file-size: ${RECORDING_MAX_FILE_SIZE:2GB}
      # 요청 전체 한도는 파일 크기에 multipart 봉투(경계 문자열·파트 헤더)를 더한 값이라
      # 파일 한도와 같게 두면 정확히 2GB인 파일이 거부된다. 실측 오버헤드는 파트 2개에
      # 312바이트였고 파일명 길이에 따라 변하므로 1MB 여유를 둔다.
      max-request-size: ${RECORDING_MAX_REQUEST_SIZE:2049MB}
      # 2GB 파일을 메모리에 담지 않도록 임계값을 0으로 두어 항상 디스크로 스풀한다.
      file-size-threshold: 0

livekit:
  url: ${LIVEKIT_URL}
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}
  test-token-enabled: ${LIVEKIT_TEST_TOKEN_ENABLED:false}

app:
  application:
    # 응모 전 이메일 인증을 강제한다. 현재 배포 환경에서는 임시로 비활성화한다.
    email-verification-required: ${APPLICATION_EMAIL_VERIFICATION_REQUIRED:false}
    # 같은 기기 토큰으로 다른 계정이 이미 응모했을 때의 처리 정책이다.
    # FLAG 는 응모를 허용하고 경고 로그만 남기며, BLOCK 은 409 로 거부한다.
    # 공용 PC·가족 기기의 정상 사용자를 막을 수 있어 기본값은 FLAG 다.
    device-duplicate-policy: ${APPLICATION_DEVICE_DUPLICATE_POLICY:FLAG}
    # 반복 클릭과 스크립트 응모를 억제하는 팬 단위 요청 상한이다.
    submit-rate-limit-count: ${APPLICATION_SUBMIT_RATE_LIMIT_COUNT:5}
    submit-rate-limit-window-seconds: ${APPLICATION_SUBMIT_RATE_LIMIT_WINDOW_SECONDS:60}

  email-verification:
    # 인증 링크 유효 시간이며 기본 30분이다.
    ttl-seconds: ${EMAIL_VERIFY_TTL_SECONDS:1800}
    # 재발송 최소 간격이며 기본 60초다. 스팸과 발송 비용을 막는다.
    resend-cooldown-seconds: ${EMAIL_RESEND_COOLDOWN_SECONDS:60}
    # 사용자별 발송 상한과 집계 구간이며 기본은 한 시간에 5통이다.
    send-limit-count: ${EMAIL_VERIFY_SEND_LIMIT_COUNT:5}
    send-limit-window-seconds: ${EMAIL_VERIFY_SEND_LIMIT_WINDOW_SECONDS:3600}
    # 토큰 확인 실패를 반복하는 요청을 억제한다.
    confirm-limit-count: ${EMAIL_VERIFY_CONFIRM_LIMIT_COUNT:10}
    confirm-limit-window-seconds: ${EMAIL_VERIFY_CONFIRM_LIMIT_WINDOW_SECONDS:600}
    # 메일 링크가 향하는 프론트 인증 완료 화면 주소다. 여기에 token 쿼리를 붙여 보낸다.
    base-url: ${EMAIL_VERIFY_BASE_URL:http://localhost:5173/verify-email}
    # 발신 주소이며 SMTP 계정이 위조 발송을 거부하므로 MAIL_USERNAME 과 같은 값을 쓴다.
    from: ${MAIL_FROM:no-reply@melly.local}

  device:
    # 기기 토큰 해시에 사용하는 HMAC 비밀값이다. 운영에서는 반드시 별도 값으로 교체한다.
    hmac-secret: ${DEVICE_TOKEN_SECRET:local-device-token-secret-change-me}
    # 기기 식별 보관 기간과 맞춘 쿠키 수명이며 기본 90일이다.
    cookie-max-age-seconds: ${DEVICE_COOKIE_MAX_AGE_SECONDS:7776000}
    # 운영은 HTTPS 라 true 를 쓰고, 로컬 http 개발에서는 false 여야 쿠키가 저장된다.
    cookie-secure: ${DEVICE_COOKIE_SECURE:false}
    # 운영은 프론트와 백엔드가 같은 도메인이고 로컬도 포트만 다른 동일 사이트라 Lax 로 충분하다.
    cookie-same-site: ${DEVICE_COOKIE_SAME_SITE:Lax}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  auth:
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-block-duration: ${LOGIN_BLOCK_DURATION:900}
    # 짧은 구간에 같은 IP 에서 계정을 반복 생성하는 것을 억제한다.
    signup-rate-limit-count: ${SIGNUP_RATE_LIMIT_COUNT:5}
    signup-rate-limit-window-seconds: ${SIGNUP_RATE_LIMIT_WINDOW_SECONDS:600}

  organization:
    invitation-ttl-seconds: ${ORGANIZATION_INVITATION_TTL_SECONDS:86400}

  meeting:
    # 응모 시작 시각이 지난 공개 팬미팅을 응모 접수 상태로 바꾸는 주기이며 기본 1분이다.
    application-open-check-delay-ms: ${MEETING_APPLICATION_OPEN_CHECK_DELAY_MS:60000}

  call:
    # 통화 제한 시간과 재접속 유예 만료를 확인하는 주기이며 기본 1초다.
    expiration-check-delay-ms: ${CALL_EXPIRATION_CHECK_DELAY_MS:1000}
    # 호출 후 팬과 인플루언서의 접속을 기다리는 최대 시간이며 기본 60초다.
    # 이 시간이 지나면 노쇼로 마감해 다음 참가자를 호출할 수 있게 한다.
    connect-timeout-sec: ${CALL_CONNECT_TIMEOUT_SEC:60}
    # 연결 시간이 초과된 대기 세션을 찾는 주기이며 기본 1초다.
    connect-timeout-check-delay-ms: ${CALL_CONNECT_TIMEOUT_CHECK_DELAY_MS:1000}

  attachment:
    # 공지 첨부파일을 저장할 서버 디스크 최상위 경로다. Docker에서는 이 경로를 볼륨으로 보존한다.
    storage-root: ${ATTACHMENT_STORAGE_ROOT:/srv/melly/attachments}
    # 첨부파일 하나의 최대 바이트이며 기본 10MB다.
    max-file-size-bytes: ${ATTACHMENT_MAX_FILE_SIZE_BYTES:10485760}

  recording:
    # 녹화 파일을 저장할 서버 디스크 최상위 경로다. Docker에서는 이 경로를 볼륨으로 보존한다.
    storage-root: ${RECORDING_STORAGE_ROOT:/srv/melly/uploads}
    # 업로드 완료 후 보관 기간이며 지나면 만료 스케줄러가 파일을 지우고 EXPIRED로 바꾼다.
    retention-days: ${RECORDING_RETENTION_DAYS:7}
    # 재생·다운로드용 임시 토큰 유효 시간이다.
    download-token-ttl-seconds: ${RECORDING_DOWNLOAD_TOKEN_TTL_SECONDS:600}
    # 만료 대상 조회 주기이며 기본 10분이다.
    expiration-check-delay-ms: ${RECORDING_EXPIRATION_CHECK_DELAY_MS:600000}
    # 업로드 파일 최대 바이트이며 multipart 한도와 같은 2GB를 유지한다.
    max-file-size-bytes: ${RECORDING_MAX_FILE_SIZE_BYTES:2147483648}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600}
