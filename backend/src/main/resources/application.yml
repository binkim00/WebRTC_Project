spring:
  application:
    name: melly-backend

  config:
    import: "optional:file:./.env[.properties]"

  docker:
    compose:
      enabled: true

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:melly}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:melly_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # 녹화 파일 자체의 최대 크기는 2GB다.
      max-file-size: ${RECORDING_MAX_FILE_SIZE:2GB}
      # 요청 전체 한도는 파일 크기에 multipart 봉투(경계 문자열·파트 헤더)를 더한 값이라
      # 파일 한도와 같게 두면 정확히 2GB인 파일이 거부된다. 실측 오버헤드는 파트 2개에
      # 312바이트였고 파일명 길이에 따라 변하므로 1MB 여유를 둔다.
      max-request-size: ${RECORDING_MAX_REQUEST_SIZE:2049MB}
      # 2GB 파일을 메모리에 담지 않도록 임계값을 0으로 두어 항상 디스크로 스풀한다.
      file-size-threshold: 0

livekit:
  url: ${LIVEKIT_URL}
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}
  test-token-enabled: ${LIVEKIT_TEST_TOKEN_ENABLED:false}

app:
  application:
    # 응모 전 이메일 인증을 강제한다. 현재 배포 환경에서는 임시로 비활성화한다.
    email-verification-required: ${APPLICATION_EMAIL_VERIFICATION_REQUIRED:false}
    # 동일 기기 다계정 응모 처리 정책이다. FLAG는 표시만, BLOCK은 409로 거부한다.
    device-duplicate-policy: ${APPLICATION_DEVICE_DUPLICATE_POLICY:FLAG}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  auth:
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-block-duration: ${LOGIN_BLOCK_DURATION:900}

  email-verification:
    # 인증 링크 유효 시간이며 기본 30분이다.
    ttl-seconds: ${EMAIL_VERIFY_TTL_SECONDS:1800}
    # 메일 링크가 가리킬 프론트엔드 인증 완료 화면 주소다.
    base-url: ${EMAIL_VERIFY_BASE_URL:http://localhost:5173/email-verification}
    # 발송 수단이다. SMTP 구현을 추가하기 전까지는 log만 지원하며 메일이 실제로 나가지 않는다.
    delivery: ${EMAIL_VERIFY_DELIVERY:log}
    # 인증 토큰 원문을 응답·로그에 노출한다. local/dev/test 프로파일에서만 켤 수 있고
    # 그 외 환경에서 true면 애플리케이션이 기동에 실패한다.
    expose-link: ${EMAIL_VERIFY_EXPOSE_LINK:false}
    # 같은 사용자의 재발송 최소 간격이다.
    resend-cooldown-seconds: ${EMAIL_VERIFY_RESEND_COOLDOWN_SECONDS:60}
    # 집계 구간과 그 안에서 허용할 최대 발송 횟수다.
    max-send-per-window: ${EMAIL_VERIFY_MAX_SEND_PER_WINDOW:5}
    send-window-seconds: ${EMAIL_VERIFY_SEND_WINDOW_SECONDS:3600}
    # 토큰 무차별 대입을 막기 위한 확인 실패 상한과 집계 구간이다.
    max-confirm-failures: ${EMAIL_VERIFY_MAX_CONFIRM_FAILURES:10}
    confirm-failure-window-seconds: ${EMAIL_VERIFY_CONFIRM_FAILURE_WINDOW_SECONDS:600}
    # 토큰 해시용 비밀값이며 지정하지 않으면 JWT 비밀값을 사용한다.
    token-secret: ${EMAIL_VERIFY_TOKEN_SECRET:${jwt.secret}}

  device-token:
    # 서버가 발급하는 기기 토큰 쿠키 이름이다. 프론트는 이 값을 읽지도 만들지도 않는다.
    cookie-name: ${DEVICE_TOKEN_COOKIE_NAME:melly_device}
    # 운영에서는 반드시 true여야 한다. SameSite=None을 쓰면 Secure도 필수다.
    secure: ${DEVICE_TOKEN_SECURE:true}
    # 프론트·백엔드 도메인 구조에 맞춰 Lax 또는 None을 쓴다.
    same-site: ${DEVICE_TOKEN_SAME_SITE:Lax}
    # 기기 식별 보관 기간이며 개인정보처리방침의 보관 기간과 맞춘다.
    max-age-days: ${DEVICE_TOKEN_MAX_AGE_DAYS:90}
    # 기기 토큰 해시용 비밀값이며 지정하지 않으면 JWT 비밀값을 사용한다.
    secret: ${DEVICE_TOKEN_SECRET:${jwt.secret}}

  organization:
    invitation-ttl-seconds: ${ORGANIZATION_INVITATION_TTL_SECONDS:86400}

  meeting:
    # 응모 시작 시각이 지난 공개 팬미팅을 응모 접수 상태로 바꾸는 주기이며 기본 1분이다.
    application-open-check-delay-ms: ${MEETING_APPLICATION_OPEN_CHECK_DELAY_MS:60000}

  call:
    # 통화 제한 시간과 재접속 유예 만료를 확인하는 주기이며 기본 1초다.
    expiration-check-delay-ms: ${CALL_EXPIRATION_CHECK_DELAY_MS:1000}
    # 호출 후 팬과 인플루언서의 접속을 기다리는 최대 시간이며 기본 60초다.
    # 이 시간이 지나면 노쇼로 마감해 다음 참가자를 호출할 수 있게 한다.
    connect-timeout-sec: ${CALL_CONNECT_TIMEOUT_SEC:60}
    # 연결 시간이 초과된 대기 세션을 찾는 주기이며 기본 1초다.
    connect-timeout-check-delay-ms: ${CALL_CONNECT_TIMEOUT_CHECK_DELAY_MS:1000}

  attachment:
    # 공지 첨부파일을 저장할 서버 디스크 최상위 경로다. Docker에서는 이 경로를 볼륨으로 보존한다.
    storage-root: ${ATTACHMENT_STORAGE_ROOT:/srv/melly/attachments}
    # 첨부파일 하나의 최대 바이트이며 기본 10MB다.
    max-file-size-bytes: ${ATTACHMENT_MAX_FILE_SIZE_BYTES:10485760}

  recording:
    # 녹화 파일을 저장할 서버 디스크 최상위 경로다. Docker에서는 이 경로를 볼륨으로 보존한다.
    storage-root: ${RECORDING_STORAGE_ROOT:/srv/melly/uploads}
    # 업로드 완료 후 보관 기간이며 지나면 만료 스케줄러가 파일을 지우고 EXPIRED로 바꾼다.
    retention-days: ${RECORDING_RETENTION_DAYS:7}
    # 재생·다운로드용 임시 토큰 유효 시간이다.
    download-token-ttl-seconds: ${RECORDING_DOWNLOAD_TOKEN_TTL_SECONDS:600}
    # 만료 대상 조회 주기이며 기본 10분이다.
    expiration-check-delay-ms: ${RECORDING_EXPIRATION_CHECK_DELAY_MS:600000}
    # 업로드 파일 최대 바이트이며 multipart 한도와 같은 2GB를 유지한다.
    max-file-size-bytes: ${RECORDING_MAX_FILE_SIZE_BYTES:2147483648}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600}
