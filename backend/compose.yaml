services:
  mysql:
    image: 'mysql:8.4'
    # 운영과 같은 시간대로 맞춘다. 이게 없으면 컨테이너가 UTC 라서
    # data-local.sql 의 NOW() 가 애플리케이션 시각보다 9시간 이르게 들어간다.
    command: --default-time-zone=+09:00
    environment:
      - 'TZ=Asia/Seoul'
      - 'MYSQL_DATABASE=melly'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=melly_user'
    ports:
      - '3307:3306'

  redis:
    image: 'redis:7.4-alpine'
    environment:
      - 'TZ=Asia/Seoul'
    ports:
      - '6379:6379'

  # 로컬에서 인증 메일을 실제로 외부에 보내지 않고 가로채 확인하는 SMTP 서버다.
  # 발송 확인은 http://localhost:8025 웹 UI 에서 한다.
  mailpit:
    image: 'axllent/mailpit:latest'
    environment:
      - 'TZ=Asia/Seoul'
    ports:
      - '1025:1025'
      - '8025:8025'
