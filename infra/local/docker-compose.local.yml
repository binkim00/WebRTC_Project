services:
  mysql:
    image: mysql:8.4
    container_name: melly-local-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    ports:
      - "${DB_PORT}:3306"

    volumes:
      - melly-local-mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: melly-local-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - melly-local-redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.4
    container_name: melly-local-livekit
    restart: unless-stopped

    command:
      - --config
      - /etc/livekit.yaml

    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

    ports:
      - "${LIVEKIT_HTTP_PORT}:7880"
      - "${LIVEKIT_TCP_PORT}:7881"
      - "${LIVEKIT_UDP_PORT_START}-${LIVEKIT_UDP_PORT_END}:50000-50100/udp"

    volumes:
      - ./livekit.local.yaml:/etc/livekit.yaml:ro

volumes:
  melly-local-mysql-data:
  melly-local-redis-data:
