services:
  mysql:
    image: mysql:8.4
    container_name: melly-local-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME:-melly}
      MYSQL_USER: ${DB_USERNAME:-melly_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}

    ports:
      - "${DB_PORT:-3306}:3306"

    volumes:
      - melly-local-mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - melly-local-network

  redis:
    image: redis:7.4-alpine
    container_name: melly-local-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      - melly-local-redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - melly-local-network

  livekit:
    image: livekit/livekit-server:v1.13.4
    container_name: melly-local-livekit
    restart: unless-stopped

    command:
      - --config
      - /etc/livekit.yaml

    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-melly_local_dev}: ${LIVEKIT_API_SECRET:-melly_local_dev_secret_1234567890abcdef}"

    depends_on:
      redis:
        condition: service_healthy

    ports:
      - "${LIVEKIT_HTTP_PORT:-17880}:7880"
      - "${LIVEKIT_TCP_PORT:-17881}:7881"
      - "18000-18010:50000-50010/udp"

    volumes:
      - ./livekit.local.yaml:/etc/livekit.yaml:ro

    networks:
      - melly-local-network

volumes:
  melly-local-mysql-data:
  melly-local-redis-data:

networks:
  melly-local-network:
    driver: bridge
