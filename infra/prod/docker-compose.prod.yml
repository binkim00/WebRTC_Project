services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - /home/ubuntu/docker/project/mysql/data:/var/lib/mysql

    ports:
      - "127.0.0.1:3307:3306"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - melly-network

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - /home/ubuntu/docker/project/redis/data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - melly-network

  livekit:
    image: livekit/livekit-server:v1.13.4
    container_name: livekit
    restart: unless-stopped

    command:
      - --config
      - /etc/livekit.yaml

    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

    depends_on:
      redis:
        condition: service_healthy

    expose:
      - "7880"

    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"

    volumes:
      - ./livekit/livekit.prod.yaml:/etc/livekit.yaml:ro

    networks:
      - melly-network

  backend:
    build:
        context: ../../backend
        dockerfile: Dockerfile
    image: melly-backend:local
    container_name: backend
    restart: unless-stopped

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      LIVEKIT_TEST_TOKEN_ENABLED: ${LIVEKIT_TEST_TOKEN_ENABLED}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES}
      LOGIN_BLOCK_DURATION: ${LOGIN_BLOCK_DURATION}

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - melly-network

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: melly-frontend:local
    container_name: frontend
    restart: unless-stopped

    networks:
      - melly-network

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped

    depends_on:
      - backend
      - frontend
      - livekit

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    networks:
      - melly-network

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: melly-jenkins:local
    container_name: jenkins
    restart: unless-stopped
    user: root

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/docker/project/jenkins_home:/var/jenkins_home

    networks:
      - melly-network

networks:
  melly-network:
    driver: bridge
