services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    
    ports:
      - "127.0.0.1:3307:3306"
    

    volumes:
      - /home/ubuntu/docker/project/mysql/data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - melly-network

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - /home/ubuntu/docker/project/redis/data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - melly-network

  livekit:
    image: livekit/livekit-server:v1.13.4
    container_name: livekit
    restart: unless-stopped

    command:
      - --config
      - /etc/livekit.yaml

    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

    depends_on:
      redis:
        condition: service_healthy

    expose:
      - "7880"

    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"

    volumes:
      - ./livekit/livekit.prod.yaml:/etc/livekit.yaml:ro

    networks:
      - melly-network

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile

    image: melly-backend:local
    container_name: backend
    restart: unless-stopped

    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_TEST_TOKEN_ENABLED: ${LIVEKIT_TEST_TOKEN_ENABLED}

      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}

      RECORDING_STORAGE_ROOT: ${RECORDING_STORAGE_ROOT:-/srv/melly/uploads}
      RECORDING_RETENTION_DAYS: ${RECORDING_RETENTION_DAYS:-7}

      ATTACHMENT_STORAGE_ROOT: ${ATTACHMENT_STORAGE_ROOT:-/srv/melly/attachments}

    volumes:
      # 업로드 파일은 컨테이너가 아니라 호스트 디스크에 남겨야 재생성·재배포 후에도 보존된다.
      # 컨테이너 안의 경로를 호스트와 같게 두어 설정값을 그대로 쓸 수 있게 한다.
      - ${RECORDING_STORAGE_ROOT:-/srv/melly/uploads}:${RECORDING_STORAGE_ROOT:-/srv/melly/uploads}
      - ${ATTACHMENT_STORAGE_ROOT:-/srv/melly/attachments}:${ATTACHMENT_STORAGE_ROOT:-/srv/melly/attachments}

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - melly-network

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile

    image: melly-frontend:local
    container_name: frontend
    restart: unless-stopped

    networks:
      - melly-network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped

    ports:
      - "127.0.0.1:9000:9000"
      - "9443:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

    networks:
      - melly-network

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped

    depends_on:
      - backend
      - frontend
      - livekit
      - portainer

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    networks:
      - melly-network

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile

    image: melly-jenkins:local
    container_name: jenkins
    restart: unless-stopped
    user: root

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/docker/project/jenkins_home:/var/jenkins_home
      - /home/ubuntu/docker/project:/home/ubuntu/docker/project

    networks:
      - melly-network

volumes:
  portainer_data:
    external: true
    name: portainer_data

networks:
  melly-network:
    external: true
    name: project_melly-network
