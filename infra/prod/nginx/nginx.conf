events {}

http {

    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:8080;
    }

    upstream livekit {
        server livekit:7880;
    }

    upstream portainer {
        server portainer:9000;
    }

    upstream jenkins {
        keepalive 32;
        server jenkins:8080;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 기본 업로드 상한이며 nginx 기본값과 같은 1MB를 명시해 둔다.
    # 큰 본문이 필요한 경로만 아래에서 개별로 올린다. 전역으로 올리면 로그인 같은
    # 엔드포인트도 거대한 본문을 받아들이게 되므로 기본값은 좁게 유지한다.
    client_max_body_size 1m;

    # HTTP 요청을 HTTPS로 리다이렉트
    server {
        listen 80;
        server_name i15e106.p.ssafy.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 서버
    server {
        listen 443 ssl http2;
        server_name i15e106.p.ssafy.io;

        ssl_certificate /etc/letsencrypt/live/i15e106.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/i15e106.p.ssafy.io/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        # LiveKit WebSocket 연결
        location /rtc {
            proxy_pass http://livekit;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
        }

        # LiveKit 서버 API
        # LiveKit agent worker WebSocket connection
        location /agent {
            proxy_pass http://livekit;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
        }

        location /twirp/ {
            proxy_pass http://livekit;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 녹화 파일 업로드 (REC-001)
        # 정규식 location 은 prefix location 보다 먼저 매칭되므로 아래 /api/ 규칙 대신
        # 이 블록이 적용된다. 그래서 proxy 설정을 여기에 다시 적어 준다.
        location ~ ^/api/v1/call-sessions/[0-9]+/recordings/upload$ {
            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # 이 한도는 파일이 아니라 multipart 봉투를 포함한 요청 전체에 걸린다.
            # 2g 로 두면 정확히 2GB 인 파일이 봉투 때문에 한도를 넘어 거부되므로,
            # 애플리케이션의 max-request-size 와 같은 2049m(2GB + 1MB)로 맞춘다.
            # 실측 봉투 오버헤드는 파트 2개에 312바이트였다.
            client_max_body_size 2049m;

            # 업로드 본문을 nginx 디스크에 먼저 받아 두지 않고 백엔드로 바로 흘려보낸다.
            # 2GB 파일을 이중으로 저장하지 않으려면 필요하다.
            proxy_request_buffering off;

            # 기본 60초로는 2GB 전송을 마칠 수 없다. 30분이면 약 9Mbps 로도 완료된다.
            client_body_timeout 1800s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
        }

        # 공지 첨부파일 업로드 (ATTACH-001)
        # 정확히 일치하는 경로라 = 로 잡는다. 이 블록이 아래 /api/ 규칙 대신 적용되므로
        # proxy 설정을 여기에 다시 적어 준다.
        location = /api/v1/attachments {
            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # 첨부파일 하나의 한도는 10MB(ATTACHMENT_MAX_FILE_SIZE_BYTES)다.
            # 이 한도는 파일이 아니라 multipart 봉투를 포함한 요청 전체에 걸리므로
            # 10m 로 두면 정확히 10MB 인 파일이 거부된다. 1MB 여유를 더해 11m 로 맞춘다.
            client_max_body_size 11m;
        }

        # 녹화 재생·다운로드 (REC-003)
        # 응답을 nginx 가 모아 두면 Range 탐색 응답이 늦어지므로 그대로 흘려보낸다.
        location ~ ^/api/v1/recordings/[0-9]+/content$ {
            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Range 요청을 그대로 백엔드에 전달한다.
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            proxy_buffering off;
            proxy_read_timeout 1800s;
        }

        # Spring Boot API
        location /api/ {
            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # /portainer로 접속하면 마지막 슬래시 추가
        location = /portainer {
            return 301 /portainer/;
        }

        # Portainer 관리 화면
        location /portainer/ {
            proxy_pass http://portainer;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_buffering off;
        }

        # Jenkins는 내부 HTTP를 유지하고 외부에서는 Nginx HTTPS 경로로만 접근한다.
        location = /jenkins {
            return 301 /jenkins/;
        }

        location /jenkins/ {
            proxy_pass http://jenkins;
            proxy_redirect default;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            client_max_body_size 10m;
            client_body_buffer_size 128k;
            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
        }

        # React 프론트엔드
        location / {
            proxy_pass http://frontend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
