events {}

http {

    upstream frontend {
        server frontend:80;
    }

    upstream backend {
        server backend:8080;
    }

    upstream livekit {
        server livekit:7880;
    }

    upstream portainer {
        server portainer:9000;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # HTTP 요청을 HTTPS로 리다이렉트
    server {
        listen 80;
        server_name i15e106.p.ssafy.io;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 서버
    server {
        listen 443 ssl http2;
        server_name i15e106.p.ssafy.io;

        ssl_certificate /etc/letsencrypt/live/i15e106.p.ssafy.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/i15e106.p.ssafy.io/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        # LiveKit WebSocket 연결
        location /rtc {
            proxy_pass http://livekit;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_buffering off;
        }

        # LiveKit 서버 API
        location /twirp/ {
            proxy_pass http://livekit;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Spring Boot API
        location /api/ {
            proxy_pass http://backend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # /portainer로 접속하면 마지막 슬래시 추가
        location = /portainer {
            return 301 /portainer/;
        }

        # Portainer 관리 화면
        location /portainer/ {
            proxy_pass http://portainer;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_buffering off;
        }

        # React 프론트엔드
        location / {
            proxy_pass http://frontend;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
