services:
  egress:
    image: ${LIVEKIT_EGRESS_IMAGE:-livekit/egress:v1.13.0}
    container_name: livekit-egress-poc
    restart: "no"

    environment:
      # Compose가 secret을 치환한 뒤 Egress가 전체 YAML 본문을 읽는다.
      EGRESS_CONFIG_BODY: |
        api_key: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}"
        api_secret: "${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}"
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
          db: 1
        health_port: 8081
        prometheus_port: 9090
        logging:
          level: info
          json: true
        backup_storage: /out/backup
        # PoC에서는 추가 SYS_ADMIN 권한 없이 실행하기 위해 명시적으로 끈다.
        # 운영 전환 시 공식 seccomp profile을 적용하고 true 전환을 검토한다.
        enable_chrome_sandbox: false
        cpu_cost:
          room_composite_cpu_cost: 3.0
          web_cpu_cost: 3.0
          track_composite_cpu_cost: 2.0
          track_cpu_cost: 1.0
        session_limits:
          file_output_max_duration: 10m

    # 4 vCPU 운영 서버에서 SFU와 backend가 사용할 CPU를 최소한 남긴다.
    cpus: 3.0
    mem_limit: 4g
    shm_size: 1gb
    pids_limit: 512

    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

    expose:
      - "8081"
      - "9090"

    volumes:
      - ${EGRESS_POC_OUTPUT_ROOT:-/srv/melly/uploads/egress-poc}:/out

    healthcheck:
      test: ["CMD-SHELL", "bash -ec ': > /dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

    networks:
      - melly-network
